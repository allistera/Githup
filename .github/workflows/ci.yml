name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, type-check, and test
        run: npm run check

      - name: Validate Worker and Sandbox bundle
        run: npm run deploy:dry-run

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate deployment secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WORKER_GITHUB_TOKEN: ${{ secrets.WORKER_GITHUB_TOKEN }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          PROJEKTOR_MCP_URL: ${{ secrets.PROJEKTOR_MCP_URL }}
          PROJEKTOR_API_TOKEN: ${{ secrets.PROJEKTOR_API_TOKEN }}
          PROJEKTOR_ACCESS_CLIENT_ID: ${{ secrets.PROJEKTOR_ACCESS_CLIENT_ID }}
          PROJEKTOR_ACCESS_CLIENT_SECRET: ${{ secrets.PROJEKTOR_ACCESS_CLIENT_SECRET }}
        run: |
          missing=0
          for secret_name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ANTHROPIC_API_KEY WORKER_GITHUB_TOKEN API_TOKEN; do
            if [[ -z "${!secret_name}" ]]; then
              printf 'Missing required GitHub secret: %s\n' "$secret_name" >&2
              missing=1
            fi
          done
          if (( missing )); then
            exit 1
          fi

          if [[ -n "$PROJEKTOR_MCP_URL" || -n "$PROJEKTOR_API_TOKEN" ]]; then
            if [[ -z "$PROJEKTOR_MCP_URL" || -z "$PROJEKTOR_API_TOKEN" ]]; then
              printf 'PROJEKTOR_MCP_URL and PROJEKTOR_API_TOKEN must both be set\n' >&2
              exit 1
            fi
          fi

          if [[ -n "$PROJEKTOR_ACCESS_CLIENT_ID" || -n "$PROJEKTOR_ACCESS_CLIENT_SECRET" ]]; then
            if [[ -z "$PROJEKTOR_ACCESS_CLIENT_ID" || -z "$PROJEKTOR_ACCESS_CLIENT_SECRET" ]]; then
              printf 'PROJEKTOR_ACCESS_CLIENT_ID and PROJEKTOR_ACCESS_CLIENT_SECRET must both be set\n' >&2
              exit 1
            fi
            if [[ -z "$PROJEKTOR_MCP_URL" ]]; then
              printf 'Projektor Access secrets require the Projektor MCP secrets\n' >&2
              exit 1
            fi
          fi

      - name: Deploy Worker and runtime secrets
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.114.0"
          preCommands: wrangler deployments list >/dev/null 2>&1 || npx wrangler deploy
          command: deploy
          secrets: |
            ANTHROPIC_API_KEY
            GITHUB_TOKEN
            API_TOKEN
            ${{ secrets.PROJEKTOR_MCP_URL != '' && 'PROJEKTOR_MCP_URL' || '' }}
            ${{ secrets.PROJEKTOR_API_TOKEN != '' && 'PROJEKTOR_API_TOKEN' || '' }}
            ${{ secrets.PROJEKTOR_ACCESS_CLIENT_ID != '' && 'PROJEKTOR_ACCESS_CLIENT_ID' || '' }}
            ${{ secrets.PROJEKTOR_ACCESS_CLIENT_SECRET != '' && 'PROJEKTOR_ACCESS_CLIENT_SECRET' || '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.WORKER_GITHUB_TOKEN }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          PROJEKTOR_MCP_URL: ${{ secrets.PROJEKTOR_MCP_URL }}
          PROJEKTOR_API_TOKEN: ${{ secrets.PROJEKTOR_API_TOKEN }}
          PROJEKTOR_ACCESS_CLIENT_ID: ${{ secrets.PROJEKTOR_ACCESS_CLIENT_ID }}
          PROJEKTOR_ACCESS_CLIENT_SECRET: ${{ secrets.PROJEKTOR_ACCESS_CLIENT_SECRET }}

      - name: Verify deployment health
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          if [[ -z "$DEPLOYMENT_URL" ]]; then
            printf 'Wrangler did not return a deployment URL\n' >&2
            exit 1
          fi
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors "$DEPLOYMENT_URL/health"
