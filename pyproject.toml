[project]
name = "github-update"
version = "0.1.0"
description = "Fan out Claude Agent SDK workers to update dependencies and fix Dependabot alerts across your GitHub repos."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.123",
    "pyyaml>=6.0.3",
]

[project.scripts]
github-update = "github_update.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["github_update"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Only our own tests; work_repos/ holds throwaway clones with their own suites.
testpaths = ["tests"]
